<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi universo eres tú 🩶</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { height: 100vh; background: #02000b; font-family: Georgia, serif; color: white; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

/* BOTÓN */
.show-galaxy-btn { position: fixed; z-index: 9999; left: 50%; bottom: 24px; transform: translateX(-50%); background: linear-gradient(90deg,#ff7ab6,#8b5cff); color: white; border: none; padding: 14px 22px; border-radius: 999px; font-size: 16px; box-shadow: 0 6px 20px rgba(139,92,255,.18); cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease; }
.show-galaxy-btn:active { transform: translateX(-50%) scale(.98); }
.show-galaxy-btn:focus { outline: 3px solid rgba(255,183,230,.25); }

/* GALAXIA - overlay inicial */
.galaxy { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; background: radial-gradient(circle at 50% 50%, #32145f 0%, #11052d 28%, #050015 65%, #010008 100%); opacity: 0; pointer-events: none; transform: scale(.98); transition: opacity .6s ease, transform .6s ease; }
.galaxy.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
.galaxy::before { content: ""; position: absolute; width: 80vw; height: 80vw; left: 10%; top: 5%; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,80,190,.18), transparent 55%), radial-gradient(ellipse, rgba(80,120,255,.18), transparent 65%); filter: blur(35px); animation: nebula 8s ease-in-out infinite alternate; }
@keyframes nebula { from { transform: scale(1) rotate(0deg); opacity:.6 } to { transform: scale(1.25) rotate(15deg); opacity:1 } }
.stars { position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 10% 20%, white, transparent), radial-gradient(1px 1px at 20% 70%, white, transparent), radial-gradient(2px 2px at 30% 30%, white, transparent), radial-gradient(1px 1px at 40% 80%, white, transparent), radial-gradient(2px 2px at 50% 15%, white, transparent), radial-gradient(1px 1px at 60% 60%, white, transparent), radial-gradient(2px 2px at 70% 25%, white, transparent), radial-gradient(1px 1px at 80% 75%, white, transparent), radial-gradient(2px 2px at 90% 40%, white, transparent), radial-gradient(1px 1px at 15% 50%, white, transparent), radial-gradient(2px 2px at 75% 85%, white, transparent), radial-gradient(1px 1px at 55% 90%, white, transparent); animation: stars 5s ease-in-out infinite alternate; }
@keyframes stars { from { opacity: .45 } to { opacity: 1 } }
.shooting-star { position: absolute; width: 120px; height: 2px; background: linear-gradient(90deg, white, transparent); transform: rotate(-35deg); animation: shooting 6s linear infinite; opacity: 0 }
.shooting-star:nth-child(1) { top: 15%; left: -10%; animation-delay: 1s }
.shooting-star:nth-child(2) { top: 40%; left: -10%; animation-delay: 4s }
@keyframes shooting { 0% { transform: translate(0,0) rotate(-35deg); opacity:0 } 10% { opacity:1 } 30% { transform: translate(120vw,70vh) rotate(-35deg); opacity:0 } 100% { opacity:0 } }
.planet { position: absolute; width: 130px; height: 130px; right: 8%; bottom: 12%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb3e6, #8d3dcc 45%, #270b58 80%); box-shadow: 0 0 30px #a14fff, 0 0 80px rgba(180,70,255,.35); }
.planet::after { content: ""; position: absolute; width: 190px; height: 45px; top: 43px; left: -30px; border: 3px solid rgba(255,190,255,.55); border-radius: 50%; transform: rotate(-15deg); }
.heart { position: absolute; top: 15%; left: 12%; font-size: 45px; animation: heartbeat 1.5s infinite; filter: drop-shadow(0 0 15px #ff4fa3); }
@keyframes heartbeat { 0%,100%{ transform: scale(1) } 50% { transform: scale(1.25) } }
.message { position: absolute; z-index: 5; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(90%,650px); padding: 45px 30px; text-align: center; background: rgba(10,2,30,.55); border: 1px solid rgba(255,180,240,.25); border-radius: 30px; backdrop-filter: blur(10px); box-shadow: 0 0 50px rgba(170,60,255,.2), inset 0 0 30px rgba(255,100,220,.05); }
.message h1 { font-size: clamp(38px,7vw,70px); margin-bottom: 20px; background: linear-gradient(90deg,#fff,#ffb4e6,#c69cff); -webkit-background-clip: text; color: transparent }
.message p { font-size: clamp(17px,3vw,23px); line-height: 1.7; color: #eee0ff }
.message .love { margin-top: 25px; font-size: 20px; color: #ff9bd7 }
.heart-small { display: inline-block; animation: heartbeat 1.2s infinite }
.message .real-btn { margin-top: 18px; display: inline-block; background: rgba(255,255,255,.06); color: #fff; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.06); cursor: pointer }

/* BOTÓN CERRAR (para móvil) */
.close-btn { position: fixed; z-index: 10000; top: 18px; right: 18px; background: rgba(0,0,0,.35); color: #fff; border: 1px solid rgba(255,255,255,.08); padding: 8px 10px; border-radius: 10px; backdrop-filter: blur(6px); cursor: pointer; display: none }
.galaxy.visible .close-btn { display: block }

/* REAL GALAXY: canvas overlay */
.real-galaxy { position: fixed; inset: 0; z-index: 10001; display: none; background: radial-gradient(circle at 50% 50%, rgba(8,8,20,1), rgba(2,0,8,1)); }
.real-galaxy.visible { display: block }
#galaxyCanvas { width: 100%; height: 100%; display: block }
.real-wrapper { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; pointer-events:none }
.real-message { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); text-align:center; color: #fff; pointer-events:auto }
.real-message h2 { font-size: clamp(24px,4.2vw,56px); color: #fff; text-shadow: 0 12px 50px rgba(255,220,180,.08), 0 4px 12px rgba(0,0,0,.6); font-weight:700 }
.real-message .heart-grey { display:inline-block; font-size: 48px; color: #cfcfcf; filter: drop-shadow(0 12px 36px rgba(255,240,220,.06)); margin-top:10px }
.real-close { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); color: #fff; padding:8px 10px; border-radius:10px; cursor:pointer; pointer-events:auto }

@media (prefers-reduced-motion: reduce) { .galaxy::before, .stars, .shooting-star, .heart, .heart-small { animation: none !important } }
</style>
</head>

<body>

<!-- Botón para mostrar/ocultar la galaxia -->
<button id="toggle-galaxy" class="show-galaxy-btn" aria-controls="galaxy" aria-expanded="false">Mostrar galaxia</button>

<div class="galaxy" id="galaxy" role="region" aria-hidden="true">

    <button id="close-galaxy" class="close-btn" aria-label="Cerrar galaxia">Cerrar ✕</button>

    <div class="stars" aria-hidden="true"></div>

    <div class="shooting-star" aria-hidden="true"></div>
    <div class="shooting-star" aria-hidden="true"></div>

    <div class="heart" aria-hidden="true">🩶</div>

    <div class="planet" aria-hidden="true"></div>

    <div class="message">
        <h1>Mi universo eres tú</h1>

        <p>
            Entre millones de estrellas,<br>
            galaxias y planetas,<br>
            tuve la suerte de encontrarte a ti.
        </p>

        <p class="love">
            Te quiero hasta el infinito y más allá
            <span class="heart-small" aria-hidden="true">🩶</span>
        </p>

        <button id="open-real-galaxy" class="real-btn" aria-haspopup="true">Ver galaxia real</button>
    </div>

</div>

<!-- Realistic animated galaxy overlay -->
<div class="real-galaxy" id="realGalaxy" aria-hidden="true">
    <canvas id="galaxyCanvas"></canvas>
    <div class="real-wrapper" aria-hidden="true">
        <div class="real-message" role="status">
            <h2>Te amo hasta el infinito</h2>
            <!-- Usamos un SVG inline para garantizar color gris consistente -->
            <div class="heart-grey" aria-hidden="true">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 21s-7.5-4.9-9.2-8.1C.7 9.9 4.3 6 7.1 6c1.6 0 2.5 1.1 2.9 1.7.4-.6 1.3-1.7 2.9-1.7 2.8 0 6.4 3.9 4.3 6.9C19.5 16.1 12 21 12 21z" fill="#cfcfcf" />
                </svg>
            </div>
        </div>
    </div>
    <button id="close-real" class="real-close" aria-label="Cerrar vista de galaxia">Cerrar ✕</button>
</div>

<script>
(function(){
    var toggle = document.getElementById('toggle-galaxy');
    var galaxy = document.getElementById('galaxy');
    var closeBtn = document.getElementById('close-galaxy');
    var openReal = document.getElementById('open-real-galaxy');
    var real = document.getElementById('realGalaxy');
    var closeReal = document.getElementById('close-real');

    function showGalaxy() {
        galaxy.classList.add('visible');
        galaxy.setAttribute('aria-hidden','false');
        toggle.setAttribute('aria-expanded','true');
        toggle.textContent = 'Ocultar galaxia';
    }
    function hideGalaxy() {
        galaxy.classList.remove('visible');
        galaxy.setAttribute('aria-hidden','true');
        toggle.setAttribute('aria-expanded','false');
        toggle.textContent = 'Mostrar galaxia';
        toggle.focus();
    }
    toggle.addEventListener('click', function(){ if (galaxy.classList.contains('visible')) hideGalaxy(); else showGalaxy(); });
    closeBtn.addEventListener('click', hideGalaxy);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { if (real.classList.contains('visible')) hideReal(); else if (galaxy.classList.contains('visible')) hideGalaxy(); } });
    galaxy.addEventListener('click', function(e){ if (e.target === galaxy) hideGalaxy(); });

    // Open the realistic animated galaxy
    openReal.addEventListener('click', function(){ hideGalaxy(); showReal(); });

    function showReal(){ real.classList.add('visible'); real.setAttribute('aria-hidden','false'); startGalaxy(); }
    function hideReal(){ real.classList.remove('visible'); real.setAttribute('aria-hidden','true'); stopGalaxy(); toggle.focus(); }
    closeReal.addEventListener('click', hideReal);
    real.addEventListener('click', function(e){ if (e.target === real) hideReal(); });

    // ------------------ Canvas Galaxy (más realista) ------------------
    var canvas = document.getElementById('galaxyCanvas');
    var ctx = canvas.getContext('2d');
    var off = document.createElement('canvas');
    var offCtx = off.getContext('2d');
    var particles = [];
    var starfield = [];
    var animId = null;
    var running = false;
    var rotation = 0;

    function resize(){
        var ratio = window.devicePixelRatio || 1;
        canvas.width = Math.round(window.innerWidth * ratio);
        canvas.height = Math.round(window.innerHeight * ratio);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(ratio,0,0,ratio,0,0);

        off.width = canvas.width;
        off.height = canvas.height;
        offCtx.setTransform(ratio,0,0,ratio,0,0);
    }
    window.addEventListener('resize', function(){ if (real.classList.contains('visible')) { resize(); createParticles(); } else { resize(); } });

    function createParticles(){
        particles = [];
        starfield = [];
        var w = window.innerWidth;
        var h = window.innerHeight;
        var cx = w/2, cy = h/2;
        var maxR = Math.min(w,h) * 0.48;
        var arms = 4;
        var density = Math.max(1200, Math.floor((w*h)/1300));
        density = Math.min(density, 3500); // cap para móviles

        for (var i=0;i<density;i++){
            var arm = i % arms;
            // usamos una distribución que concentra más partículas cerca del centro
            var rr = Math.pow(Math.random(), 1.2) * maxR;
            var baseTheta = rr * 0.02 + arm * (2*Math.PI/arms);
            var theta = baseTheta + (Math.random()-0.5) * (1.2 - rr/maxR);
            var x = cx + Math.cos(theta) * rr + (Math.random()-0.5)*8;
            var y = cy + Math.sin(theta) * rr + (Math.random()-0.5)*8;
            var size = Math.max(0.3, 1.8 * (1 - rr/maxR) * (0.5+Math.random()));
            var hue = 40 + Math.random()*60 - (rr/maxR)*50; // más amarillos en centro
            var a = 0.6 + Math.random()*0.6;
            particles.push({x:x,y:y,rr:rr,theta:theta,size:size,hue:hue,a:a,arm:arm,off:Math.random()*2000});
        }

        // starfield: puntos aleatorios en toda la pantalla
        var stars = Math.min(800, Math.floor((w*h)/15000));
        for (var s=0;s<stars;s++){
            starfield.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.2, a:0.3+Math.random()*0.8});
        }
    }

    function draw(){
        var w = canvas.width / (window.devicePixelRatio || 1);
        var h = canvas.height / (window.devicePixelRatio || 1);

        // fondo oscuro
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle = '#000006';
        ctx.fillRect(0,0,w,h);

        // starfield fondo
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#ffffff';
        for (var s=0;s<starfield.length;s++){
            var st = starfield[s];
            ctx.globalAlpha = st.a * 0.6;
            ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // dibujar partículas en offscreen para aplicar bloom/blur después
        offCtx.clearRect(0,0,off.width,off.height);
        offCtx.globalCompositeOperation = 'source-over';

        // núcleo brillante primero (offscreen)
        var coreRad = Math.min(w,h) * 0.08 + Math.abs(Math.sin(Date.now()/1200))*Math.min(w,h)*0.01;
        var coreX = w/2, coreY = h/2;
        var coreG = offCtx.createRadialGradient(coreX,coreY,0,coreX,coreY,coreRad*2.5);
        coreG.addColorStop(0,'rgba(255,250,230,1)');
        coreG.addColorStop(0.12,'rgba(255,230,200,0.9)');
        coreG.addColorStop(0.3,'rgba(255,200,160,0.3)');
        coreG.addColorStop(1,'rgba(0,0,0,0)');
        offCtx.fillStyle = coreG;
        offCtx.beginPath(); offCtx.arc(coreX, coreY, coreRad*1.6, 0, Math.PI*2); offCtx.fill();

        // partículas (polvo) en offscreen
        offCtx.globalCompositeOperation = 'lighter';
        for (var i=0;i<particles.length;i++){
            var p = particles[i];
            // movimiento en espiral: theta incrementa según distancia
            p.theta += 0.0009 + (p.rr / (Math.min(w,h))) * 0.0006;
            var px = w/2 + Math.cos(p.theta + rotation) * p.rr;
            var py = h/2 + Math.sin(p.theta + rotation) * p.rr;

            var tw = 0.45 + 0.55 * Math.sin((Date.now()+p.off)/900);
            var size = p.size * (0.6 + tw);

            var grad = offCtx.createRadialGradient(px,py,0,px,py,size*6);
            grad.addColorStop(0, 'hsla(' + Math.round(p.hue) + ',85%,' + (55 - (p.rr/(Math.min(w,h))*30)) + '%, ' + (p.a) + ')');
            grad.addColorStop(0.25, 'rgba(255,255,255,0.9)');
            grad.addColorStop(0.6, 'rgba(180,200,255,0.12)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            offCtx.fillStyle = grad;
            offCtx.beginPath(); offCtx.arc(px,py, Math.max(0.25, size), 0, Math.PI*2); offCtx.fill();
        }

        // dibujar bandas de polvo (dark lane) usando curvas alpha para simular el polvo oscurecedor
        offCtx.globalCompositeOperation = 'source-over';
        offCtx.fillStyle = 'rgba(0,0,0,0.16)';
        offCtx.beginPath();
        // dibuja una forma elíptica oscura cruzando el núcleo
        offCtx.ellipse(coreX, coreY, Math.min(w,h)*0.6, Math.min(w,h)*0.12, rotation*0.4, 0, Math.PI*2);
        offCtx.fill();

        // aplicar blur/bloom: usamos ctx.filter en el canvas destino
        // primero dibujamos offscreen a main con blur para glow
        try {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.filter = 'blur(10px) brightness(1.2)';
            ctx.drawImage(off, 0, 0, w, h);
            ctx.filter = 'none';
            ctx.restore();
        } catch (e) {
            // fallback: si filter no disponible, dibujamos sin blur
            ctx.globalCompositeOperation = 'lighter';
            ctx.drawImage(off, 0, 0, w, h);
        }

        // dibujar partículas nítidas encima para detalle
        ctx.globalCompositeOperation = 'lighter';
        for (var i=0;i<particles.length;i++){
            var p = particles[i];
            var px = w/2 + Math.cos(p.theta + rotation) * p.rr;
            var py = h/2 + Math.sin(p.theta + rotation) * p.rr;
            var size = p.size * (0.6 + 0.6 * Math.sin((Date.now()+p.off)/700));
            var g = ctx.createRadialGradient(px,py,0,px,py,size*4);
            g.addColorStop(0, 'rgba(255,255,255,0.95)');
            g.addColorStop(0.2, 'hsla(' + Math.round(p.hue) + ',85%,' + (55 - (p.rr/(Math.min(w,h))*30)) + '%, ' + (Math.min(1,p.a+0.15)) + ')');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(px,py, Math.max(0.2, size*0.9), 0, Math.PI*2); ctx.fill();
        }

        // un par de trazos suaves para los brazos densos
        ctx.globalCompositeOperation = 'lighter';
        for (var a=0;a<4;a++){
            ctx.beginPath();
            var steps = 200;
            for (var t=0;t<steps;t++){
                var frac = t/steps;
                var rr = frac * Math.min(w,h) * 0.46;
                var ang = frac*8.0 + a*(2*Math.PI/4) + rotation*4;
                var sx = w/2 + Math.cos(ang) * rr;
                var sy = h/2 + Math.sin(ang) * rr;
                if (t===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
            }
            ctx.strokeStyle = 'rgba(255,240,200,0.02)'; ctx.lineWidth = 10; ctx.stroke();
            ctx.strokeStyle = 'rgba(255,220,180,0.02)'; ctx.lineWidth = 4; ctx.stroke();
        }

        // overlay de pequeñas estrellas brillantes
        ctx.globalCompositeOperation = 'lighter';
        for (var s=0;s<120;s++){
            var sx = (Math.sin(s*12.9898 + Date.now()*0.0003) * 43758.5453) % w;
            var sy = (Math.cos(s*7.233 + Date.now()*0.0004) * 12345.6789) % h;
            var sr = 0.6 + Math.abs(Math.sin((Date.now() + s*13)/700))*1.6;
            ctx.fillStyle = 'rgba(255,255,255,' + (0.15 + Math.random()*0.6) + ')';
            ctx.beginPath(); ctx.arc(Math.abs(sx), Math.abs(sy), sr, 0, Math.PI*2); ctx.fill();
        }

        rotation += 0.0010; // rotación global
        animId = requestAnimationFrame(draw);
    }

    function startGalaxy(){
        if (running) return;
        running = true;
        resize();
        createParticles();
        animId = requestAnimationFrame(draw);
    }
    function stopGalaxy(){
        running = false;
        if (animId) cancelAnimationFrame(animId);
        animId = null;
        ctx && ctx.clearRect(0,0,canvas.width,canvas.height);
        offCtx && offCtx.clearRect(0,0,off.width,off.height);
    }

    // Pause animation when tab hidden to save CPU
    document.addEventListener('visibilitychange', function(){ if (document.hidden) { if (running && animId) { cancelAnimationFrame(animId); animId = null; } } else { if (real.classList.contains('visible') && running && !animId) animId = requestAnimationFrame(draw); } });

    // stop on low-power devices: detect small devices and cap particles
    if (window.innerWidth < 520) {
        // mobile: lighten particle creation by capping inside createParticles()
    }

    // Expose start/stop to outer scope if needed (not necessary)
})();
</script>

</body>
</html>
