<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi universo eres tú 🩶</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#02000b;font-family:Georgia,serif;color:#fff;overflow:hidden}

/* Simple overlay and message */
.container{position:relative;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, #151125 0%, #07030a 40%, #020008 100%);filter:blur(6px);opacity:.95}
.static-galaxy{position:absolute;inset:0;pointer-events:none;}
.message-box{position:relative;z-index:20;background:rgba(8,6,16,0.6);backdrop-filter:blur(6px);padding:28px 22px;border-radius:20px;border:1px solid rgba(255,255,255,0.06);text-align:center;max-width:820px}
.message-box h1{font-size:clamp(28px,5vw,56px);margin-bottom:10px;color:#fff}
.message-box p{color:#e9e1ff;margin-bottom:12px}

/* Sections (buttons) placed around center to click) */
.sections{position:absolute;inset:0;z-index:25;pointer-events:auto}
.section-btn{position:absolute;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#fff;padding:10px 14px;border-radius:12px;cursor:pointer;backdrop-filter:blur(6px);font-size:14px}
.section-btn:active{transform:scale(.98)}
.section-top-left{left:6%;top:14%}
.section-top-right{right:6%;top:14%}
.section-bottom-left{left:6%;bottom:14%}
.section-bottom-right{right:6%;bottom:14%}

/* Input panel */
.input-panel{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center}
.input-panel input{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);color:#fff;min-width:220px}
.input-panel button{padding:10px 14px;border-radius:12px;border:none;background:linear-gradient(90deg,#ff7ab6,#8b5cff);color:#fff;cursor:pointer}

/* small menu with preset phrases */
.preset-panel{position:fixed;left:16px;top:16px;z-index:30;padding:8px;background:rgba(0,0,0,0.45);border-radius:10px;border:1px solid rgba(255,255,255,0.04)}
.preset-panel button{display:block;background:transparent;border:none;color:#fff;padding:8px 6px;text-align:left;cursor:pointer}
.preset-panel button:hover{background:rgba(255,255,255,0.02);border-radius:6px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:10%;background:rgba(0,0,0,0.6);color:#fff;padding:8px 12px;border-radius:10px;display:none;z-index:60}
.toast.show{display:block}

/* accessibility */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="container">
  <div class="bg" aria-hidden="true"></div>

  <!-- Static procedural-looking SVG galaxy (non-moving) -->
  <svg class="static-galaxy" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="g1" cx="50%" cy="45%" r="40%">
        <stop offset="0%" stop-color="#fff7e6" stop-opacity="0.9"/>
        <stop offset="20%" stop-color="#ffd8c8" stop-opacity="0.55"/>
        <stop offset="45%" stop-color="#bfa0ff" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#020007" stop-opacity="0.0"/>
      </radialGradient>
      <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="24" />
      </filter>
    </defs>

    <!-- soft glow core -->
    <circle cx="600" cy="360" r="160" fill="url(#g1)"/>
    <!-- colored blobs to simulate arms -->
    <g filter="url(#blur)">
      <ellipse cx="420" cy="360" rx="260" ry="80" fill="#2b2b45" opacity="0.22" transform="rotate(-12 420 360)"/>
      <ellipse cx="770" cy="380" rx="280" ry="88" fill="#2b1e3a" opacity="0.16" transform="rotate(16 770 380)"/>
      <ellipse cx="560" cy="240" rx="160" ry="48" fill="#3a2550" opacity="0.12" transform="rotate(-26 560 240)"/>
      <ellipse cx="640" cy="520" rx="200" ry="60" fill="#2b3a4a" opacity="0.10" transform="rotate(8 640 520)"/>
    </g>

    <!-- subtle stars - static -->
    <g fill="#ffffff" opacity="0.95">
      <circle cx="120" cy="80" r="1"/>
      <circle cx="300" cy="40" r="1.4" opacity="0.9"/>
      <circle cx="980" cy="120" r="1"/>
      <circle cx="840" cy="60" r="0.9"/>
      <circle cx="420" cy="120" r="1.1"/>
      <circle cx="540" cy="20" r="0.8"/>
      <circle cx="1100" cy="400" r="1"/>
      <circle cx="200" cy="520" r="0.9"/>
      <circle cx="760" cy="700" r="1.1"/>
      <circle cx="940" cy="480" r="0.9"/>
    </g>
  </svg>

  <div class="message-box" role="region" aria-live="polite">
    <h1 id="headline">Te amo hasta el infinito</h1>
    <p id="subline">Pulsa cualquiera de los apartados alrededor para ver frases bonitas. También puedes escribir tu propio mensaje aquí abajo.</p>
  </div>

  <!-- clickable sections placed around -->
  <div class="sections" aria-hidden="false">
    <button class="section-btn section-top-left" data-msg="Eres mi luz">Eres mi luz</button>
    <button class="section-btn section-top-right" data-msg="Mi cielo">Mi cielo</button>
    <button class="section-btn section-bottom-left" data-msg="Siempre contigo">Siempre contigo</button>
    <button class="section-btn section-bottom-right" data-msg="Hasta el infinito">Hasta el infinito</button>
  </div>

</div>

<!-- Presets and input -->
<div class="preset-panel" role="toolbar" aria-label="Frases rápidas">
  <button data-msg="Eres mi sol">Eres mi sol</button>
  <button data-msg="Mi razón">Mi razón</button>
  <button data-msg="Contigo siempre">Contigo siempre</button>
</div>

<div class="input-panel" role="form" aria-label="Escribe tu mensaje">
  <input id="customInput" type="text" placeholder="Escribe algo bonito..." aria-label="Mensaje personalizado" />
  <button id="applyCustom">Poner mensaje</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var headline = document.getElementById('headline');
  var subline = document.getElementById('subline');
  var sections = document.querySelectorAll('.section-btn');
  var presets = document.querySelectorAll('.preset-panel button');
  var input = document.getElementById('customInput');
  var apply = document.getElementById('applyCustom');
  var toast = document.getElementById('toast');

  function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 2200); }

  function setHeadline(text){
    headline.textContent = text;
    subline.textContent = "Que la galaxia siempre nos recuerde esto 💫";
    showToast('Mensaje aplicado');
  }

  sections.forEach(function(btn){
    btn.addEventListener('click', function(){ var m = btn.getAttribute('data-msg') || btn.textContent; setHeadline(m); });
  });

  presets.forEach(function(btn){ btn.addEventListener('click', function(){ setHeadline(btn.getAttribute('data-msg')); }); });

  apply.addEventListener('click', function(){ var v = input.value.trim(); if(!v){ showToast('Escribe algo primero 😊'); input.focus(); return; } setHeadline(v); input.value=''; });

  // keyboard for quick apply (Enter)
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ apply.click(); } });

  // remove any moving animations if present and ensure static experience
  try{ document.querySelectorAll('canvas').forEach(function(c){ c.style.display='none'; }); } catch(e){}

  // initial friendly toast
  setTimeout(function(){ showToast('Pulsa los apartados para ver frases bonitas'); }, 700);
})();
</script>

</body>
</html>
